<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AION Command Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="theme-color" content="#0f1216">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AION">
  <!-- ASSET_V rewritten by server for cache-busting -->
  <link rel="stylesheet" href="/styles.css?v=ASSET_V">
  <script type="module" src="/app.js?v=ASSET_V"></script>
</head>
<body>
  <!-- ===== PHONE SHELL (simple vertical: header / content / bottom nav) ===== -->
  <div id="aionPhoneShell" class="aion-phone-shell" hidden>
    <header class="aion-phone-header">
      <div class="aion-brand">
        <span class="mark">A</span>
        <strong>AION</strong>
      </div>
      <div class="switch aion-workspace-switch" id="phoneWorkspaceSwitch" role="group" aria-label="Workspace"></div>
      <span class="aion-conn-badge" id="phoneConnBadge">● Private</span>
    </header>
    <main id="aionPhoneContent" class="aion-phone-content" aria-live="polite"></main>
    <nav id="aionPhoneNav" class="aion-mobile-nav" aria-label="Phone primary navigation"></nav>
  </div>

  <!-- ===== DESKTOP SHELL (unchanged structure) ===== -->
  <div id="aionDesktopShell" class="aion-desktop-shell">
    <header class="aion-header" id="aionHeader">
      <div class="aion-brand">
        <span class="mark">A</span>
        <strong>AION</strong>
        <small class="aion-header-sub">Local Command Center</small>
      </div>
      <div class="switch aion-workspace-switch" id="workspaceSwitch" role="group" aria-label="Workspace"></div>
      <span class="local aion-conn-badge" id="providerBadge">● Local</span>
    </header>
    <div class="layout aion-layout" id="aionLayout">
      <nav class="aion-area-nav" id="aionAreaNav" aria-label="AION areas"></nav>
      <main class="aion-main" id="aionMain">
        <section id="onboarding" hidden>
          <h1>Welcome to AION</h1>
          <p>AION runs on this computer. Private state lives under the ignored <code>private/aion</code> directory and is excluded from source backups.</p>
          <p>The offline deterministic provider is selected by default and performs no network call.</p>
          <button data-action="onboarding">Start with the offline provider</button>
        </section>
        <section id="content" class="aion-content" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <div id="aionMoreSheet" class="aion-more-sheet" hidden>
    <div class="aion-more-backdrop" data-do="more-close"></div>
    <div class="aion-more-panel" role="dialog" aria-label="More">
      <h2>More</h2>
      <button type="button" data-area-jump="Intake">Intake — photos &amp; files</button>
      <button type="button" data-area-jump="Knowledge">Knowledge</button>
      <button type="button" data-area-jump="Mobile">Mobile status</button>
      <button type="button" data-area-jump="Settings">Settings</button>
      <button type="button" data-area-jump="Sales">Sales (full)</button>
      <button type="button" class="danger" data-do="more-close">Close</button>
    </div>
  </div>

  <div id="toast" role="status"></div>
</body>
</html>
